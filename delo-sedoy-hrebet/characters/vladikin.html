<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="print-a6.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <title>Владыкин Игорь</title>
  <style>
:root { --bg:#f4f0e6; --card:#fffdf8; --ink:#1a1814; --muted:#5c564c; --line:#c9bfa8; --acc:#2f5d4a; --bad:#8b3a3a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 "Georgia","Times New Roman",serif; }
.wrap { max-width:820px; margin:0 auto; padding:24px 18px 48px; }
a { color:var(--acc); }
h1 { font-size:1.55rem; margin:0 0 8px; }
h2 { font-size:1.15rem; margin:28px 0 10px; border-bottom:1px solid var(--line); padding-bottom:4px; }
.meta { color:var(--muted); font-size:.92rem; margin:0 0 18px; }
.card { background:var(--card); border:1px solid var(--line); padding:16px 18px; margin:12px 0; border-radius:2px; }
table { width:100%; border-collapse:collapse; font-size:.95rem; }
th, td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
th { background:#ebe4d4; font-family:"Segoe UI",Arial,sans-serif; font-size:.8rem; text-transform:uppercase; letter-spacing:.03em; }
.pill { display:inline-block; font:700 .72rem "Segoe UI",Arial,sans-serif; padding:2px 8px; border-radius:3px; text-transform:uppercase; }
.pill-s { background:#ffcdd2; color:#b71c1c; }
.pill-w { background:#dce9e2; color:#1b5e20; }
.pill-v { background:#e8e0f0; color:#4a148c; }
.kv { display:grid; grid-template-columns:140px 1fr; gap:6px 12px; font-size:.95rem; }
.kv b { color:var(--muted); font-weight:600; font-family:"Segoe UI",Arial,sans-serif; font-size:.82rem; }
.foot { margin-top:28px; color:var(--muted); font-size:.85rem; }
.portrait-wrap {
  display:inline-block; max-width:374px; width:100%;
  margin:0 0 14px; border:1px solid var(--line); background:#fff;
  overflow:hidden;
}
.portrait { width:100%; max-width:374px; aspect-ratio:105 / 148; object-fit:cover; object-position:center top; display:block; border:0; margin:0; }
.portrait-name {
  padding:14px 16px 16px;
  font-family:"Cormorant Garamond","Playfair Display","Times New Roman",serif;
  font-size:clamp(1.35rem, 3.2vw, 1.85rem); font-weight:600;
  font-style:italic; letter-spacing:.04em; line-height:1.15;
  color:#111; text-align:left;
  background:#fff;
  border-top:1px solid var(--line);
}
.portrait-name span { display:block; }
.portrait-name .surname {
  font-style:normal; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; font-size:.72em; margin-top:2px;
}
.thumb { width:48px; height:48px; object-fit:cover; border:1px solid var(--line); vertical-align:middle; margin-right:8px; }
.namecell { display:flex; align-items:center; gap:8px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Владыкин Игорь · 55</h1>
  <div class="card">
    <div class="portrait-wrap">
      <img class="portrait" src="img/vladikin.jpg" alt="Владыкин Игорь" />
      <div class="portrait-name"><span>Игорь</span><span class="surname">Владыкин</span></div>
    </div>
  </div>

</div>
</body>
</html>
